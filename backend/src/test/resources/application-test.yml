spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://mock-issuer.example.com
          jwk-set-uri: https://mock-issuer.example.com/.well-known/jwks.json

cors:
  allowed:
    origins: http://localhost:3000

logging:
  level:
    org.springframework.security: WARN
